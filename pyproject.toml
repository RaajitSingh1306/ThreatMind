[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument (FastAPI Depends/Field)
    "N803",  # argument name should be lowercase (standard ML uppercase X)
    "N806",  # variable name should be lowercase (standard ML uppercase X)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "monitoring"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_level = "INFO"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "threatmind"
version = "0.1.0"
description = "Cybersecurity Threat Intelligence Platform — ML + LLM Agent"
requires-python = ">=3.10"
